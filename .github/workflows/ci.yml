name: COVER.RD — CI / Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ======================================================
  # 1. Pruebas Unitarias, Integración, Linting y Build
  # ======================================================
  unit-and-build:
    name: Frontend Unit Tests, Lint & Webpack Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Cache de pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Instalar Dependencias del Frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Ejecutar Pruebas Unitarias e Integración (Jest)
        run: pnpm test

      - name: Compilación de Producción (Next.js con Webpack)
        run: pnpm build

  # ======================================================
  # 2. Pruebas End-to-End con Playwright (Full Stack)
  # ======================================================
  e2e-tests:
    name: Full Stack E2E Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Levantar Backend (PostgreSQL 18 + Odoo 19)
        run: |
          cd backend
          docker compose up -d
          
          echo "Esperando que Odoo inicialice la base de datos y el addon cover_events..."
          docker exec backend-web-1 odoo --db_host=db --db_user=odoo --db_password=odoo -d postgres -i cover_events --stop-after-init || \
          docker exec backend_web_1 odoo --db_host=db --db_user=odoo --db_password=odoo -d postgres -i cover_events --stop-after-init || true
          
          docker compose restart web
          
          echo "Verificando disponibilidad de la API REST..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8069/cover/api/v1/events > /dev/null; then
              echo "✅ API Odoo lista y respondiendo en puerto 8069"
              break
            fi
            echo "Esperando API Odoo ($i/30)..."
            sleep 2
          done

      - name: Configurar Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Instalar Dependencias del Frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Instalar Navegadores de Playwright (Chromium y WebKit)
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Ejecutar Suite Playwright E2E
        working-directory: frontend
        env:
          ODOO_INTERNAL_URL: http://localhost:8069
        run: pnpm test:e2e

      - name: Subir Reporte de Playwright si ocurre algún fallo
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
